<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KADY | Enterprise Recruitment Platform</title>
    <style>
      html {
        background-color: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background-color: #030712 !important;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: inherit;
        color: inherit;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kady-theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#030712';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#ffffff';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-[#70C100]/20 selection:text-[#60A500]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
